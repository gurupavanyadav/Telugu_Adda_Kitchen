name: Reconcile staging migration history

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RECONCILE_STAGING_HISTORY to confirm this staging-only tracking-table repair.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delivery-app-staging-migration-history-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Repair staging migration history and verify policy inventory
    runs-on: ubuntu-latest
    environment:
      name: staging
    timeout-minutes: 20
    defaults:
      run:
        working-directory: delivery-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: delivery-app/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Validate explicit staging-only authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RECONCILE_STAGING_HISTORY"
          test "$SUPABASE_PROJECT_REF" = "yuindzemvnnzrtzohbkz"
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing protected staging environment secret: $variable" >&2
              exit 1
            fi
          done

      - name: Install dependencies and verify immutable migration artifacts
        run: |
          set -euo pipefail
          npm ci
          npm run verify:migrations

      - name: Link the isolated staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Record migration history before repair
        run: supabase migration list --linked | tee ../migration-history-before.txt

      - name: Reconcile already-applied migration history only
        run: |
          set -euo pipefail
          # This updates supabase_migrations.schema_migrations only. It intentionally does not run db push or any migration SQL.
          supabase migration repair --linked --status applied \
            0001 \
            20260807210118 \
            20260808205313 \
            20260809000000 \
            20260809000001 \
            20260809000002 \
            20260809000003 \
            20260816000000 \
            20260816000001 \
            20260816000002 \
            20260816000003 \
            20260816000004 \
            20260816000005 \
            20260816000006 \
            20260818000001 \
            20260818000002 \
            20260818000003 \
            20260818000004

      - name: Record migration history after repair
        run: supabase migration list --linked | tee ../migration-history-after.txt

      - name: Verify hosted hardened policies and grants
        run: supabase db query --linked --file supabase/verification/policy_grant_inventory.sql | tee ../policy-grant-inventory.txt

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-migration-history-reconciliation-evidence
          path: |
            migration-history-before.txt
            migration-history-after.txt
            policy-grant-inventory.txt
          if-no-files-found: warn
          retention-days: 90
