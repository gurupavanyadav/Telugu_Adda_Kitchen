name: Apply approved production P0 migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_P0_MIGRATIONS to apply the 20 reviewed immutable P0 migrations to the isolated production project.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delivery-app-production-p0-migrations
  cancel-in-progress: false

jobs:
  apply-approved-production-migrations:
    name: Apply reviewed P0 migrations to production
    if: github.event.inputs.confirmation == 'APPLY_PRODUCTION_P0_MIGRATIONS'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: delivery-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out reviewed repository contents
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: delivery-app/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Validate explicit production-only authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_PRODUCTION_P0_MIGRATIONS"
          test "$SUPABASE_PROJECT_REF" = "xwxjxmbafiguwrqbxgoz"
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing protected production environment secret: $variable" >&2
              exit 1
            fi
          done

      - name: Install dependencies and verify immutable migration artifacts
        run: |
          set -euo pipefail
          npm ci
          npm run verify:migrations

      - name: Link the isolated production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify the new production project has no applied repository migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee ../migration-history-before.txt
          local_versions="$(awk -F '|' '$1 ~ /`[0-9]+`/ { count += 1 } END { print count + 0 }' ../migration-history-before.txt)"
          remote_versions="$(awk -F '|' '$2 ~ /`[0-9]+`/ { count += 1 } END { print count + 0 }' ../migration-history-before.txt)"
          test "$local_versions" = "20"
          test "$remote_versions" = "0"

      - name: Apply the reviewed immutable production migration sequence
        run: supabase db push --linked

      - name: Verify hosted history, policies, and grants
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee ../migration-history-after.txt
          matched_versions="$(awk -F '|' '$1 ~ /`[0-9]+`/ && $2 ~ /`[0-9]+`/ { left = $1; right = $2; gsub(/[^0-9]/, "", left); gsub(/[^0-9]/, "", right); if (left == right) count += 1 } END { print count + 0 }' ../migration-history-after.txt)"
          test "$matched_versions" = "20"
          supabase db query --linked --file supabase/verification/policy_grant_inventory.sql | tee ../policy-grant-inventory.txt

      - name: Upload production migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-p0-migration-application-evidence
          path: |
            migration-history-before.txt
            migration-history-after.txt
            policy-grant-inventory.txt
          if-no-files-found: warn
          retention-days: 90
