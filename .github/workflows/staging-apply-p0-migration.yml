name: Apply approved staging P0 migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_STAGING_P0_MIGRATION to apply only migration 20260818000003 to isolated staging.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delivery-app-staging-p0-migration
  cancel-in-progress: false

jobs:
  apply-approved-staging-migration:
    name: Apply the approved vendor catalog grant to staging
    if: github.event.inputs.confirmation == 'APPLY_STAGING_P0_MIGRATION'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    defaults:
      run:
        working-directory: delivery-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out reviewed repository contents
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: delivery-app/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Validate explicit staging-only authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_STAGING_P0_MIGRATION"
          test "$SUPABASE_PROJECT_REF" = "yuindzemvnnzrtzohbkz"
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing protected staging environment secret: $variable" >&2
              exit 1
            fi
          done

      - name: Install dependencies and verify immutable migration artifacts
        run: |
          set -euo pipefail
          npm ci
          npm run verify:migrations

      - name: Link the isolated staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify exactly one approved migration is pending
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee ../migration-history-before.txt
          pending_versions="$(awk -F '|' '
            $1 ~ /`[0-9]+`/ && $2 !~ /`[0-9]+`/ {
              version = $1
              gsub(/[^0-9]/, "", version)
              print version
            }
          ' ../migration-history-before.txt)"
          test "$pending_versions" = "20260818000003"

      - name: Apply the approved vendor catalog grant
        run: supabase db push --linked

      - name: Verify hosted migration history, policies, and grants
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee ../migration-history-after.txt
          grep -Eq '`20260818000003`[[:space:]]*\|[[:space:]]*`20260818000003`' ../migration-history-after.txt
          supabase db query --linked --file supabase/verification/policy_grant_inventory.sql | tee ../policy-grant-inventory.txt

      - name: Upload staging migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-p0-migration-application-evidence
          path: |
            migration-history-before.txt
            migration-history-after.txt
            policy-grant-inventory.txt
          if-no-files-found: warn
          retention-days: 90
