name: Apply production Auth trigger grant fix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_HANDLE_NEW_USER_FORWARD_FIX to apply the staging-validated Auth trigger grant fix to production.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: delivery-app-production-handle-new-user-forward-fix
  cancel-in-progress: false

jobs:
  apply-approved-production-forward-fix:
    if: github.event.inputs.confirmation == 'APPLY_PRODUCTION_HANDLE_NEW_USER_FORWARD_FIX'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    defaults:
      run:
        working-directory: delivery-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out reviewed repository contents
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: delivery-app/package-lock.json

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Validate explicit production-only authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_PRODUCTION_HANDLE_NEW_USER_FORWARD_FIX"
          test "$SUPABASE_PROJECT_REF" = "xwxjxmbafiguwrqbxgoz"
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing protected production environment secret: $variable" >&2
              exit 1
            fi
          done

      - name: Install dependencies and verify immutable artifacts
        run: |
          set -euo pipefail
          npm ci
          npm run verify:migrations

      - name: Link the isolated production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify only the approved forward fix is pending
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee ../migration-history-before.txt
          pending_versions="$(awk -F '|' '$1 ~ /`[0-9]+`/ && $2 !~ /`[0-9]+`/ { version = $1; gsub(/[^0-9]/, "", version); print version }' ../migration-history-before.txt)"
          remote_versions="$(awk -F '|' '$2 ~ /`[0-9]+`/ { count += 1 } END { print count + 0 }' ../migration-history-before.txt)"
          test "$pending_versions" = "20260825000000"
          test "$remote_versions" = "20"

      - name: Apply the staging-validated Auth trigger execution-grant fix
        run: supabase db push --linked

      - name: Verify hosted history, policies, and grants
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee ../migration-history-after.txt
          grep -Eq '`20260825000000`[[:space:]]*\|[[:space:]]*`20260825000000`' ../migration-history-after.txt
          supabase db query --linked --file supabase/verification/policy_grant_inventory.sql | tee ../policy-grant-inventory.txt

      - name: Upload production forward-fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-handle-new-user-forward-fix-evidence
          path: |
            migration-history-before.txt
            migration-history-after.txt
            policy-grant-inventory.txt
          if-no-files-found: warn
          retention-days: 90
